# Builds a release when a tag like v2.1.0 is pushed: checks the tag against <Version> in OmenFanPlus.csproj (the
# one place the version lives, so builds from source carry the same number as the release and are never "updated"
# to it), runs the tests, publishes the app the way install.ps1 does, zips it, writes SHA256SUMS.txt and creates
# the GitHub release with both files. The app's update check reads that release (the zip's hash from GitHub's API,
# cross-checked against SHA256SUMS.txt) and can install it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag against the project version
        shell: pwsh
        run: |
          $project = [xml](Get-Content -Path OmenFanPlus/OmenFanPlus.csproj -Raw)
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "The tag '${{ github.ref_name }}' doesn't match <Version>$version</Version> in OmenFanPlus.csproj. Bump the version, commit, then tag."
          }
          "VERSION=$version" | Add-Content -Path $env:GITHUB_ENV

      - name: Test
        run: dotnet test OmenFanPlus.sln -c Release

      - name: Publish
        run: dotnet publish OmenFanPlus/OmenFanPlus.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish

      - name: Package
        shell: pwsh
        run: |
          $zip = "OmenFanPlus-$env:VERSION-win-x64.zip"
          $built = (Get-Item -LiteralPath artifacts/publish/OmenFanPlus.exe).VersionInfo.ProductVersion
          if ($built -ne $env:VERSION) { throw "The published exe reports version $built, not $env:VERSION." }
          Compress-Archive -Path artifacts/publish/* -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content -Path SHA256SUMS.txt

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' "OmenFanPlus-$env:VERSION-win-x64.zip" SHA256SUMS.txt --title "OmenFanPlus $env:VERSION" --generate-notes
